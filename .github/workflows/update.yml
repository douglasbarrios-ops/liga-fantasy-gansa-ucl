name: Actualizar resultados

on:
  schedule:
    # Every 10 minutes during European evening kickoffs (16:00–23:50 UTC),
    # hourly the rest of the day. GitHub cron is best-effort, not exact.
    - cron: "*/10 16-23 * * *"
    - cron: "17 0-15 * * *"
  workflow_dispatch:        # lets you refresh by hand from the Actions tab
  push:
    branches: [main]
    paths: ["update_data.py"]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch Champions League data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python update_data.py

      - name: Commit if anything changed
        run: |
          git config user.name  "ucl-bot"
          git config user.email "ucl-bot@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "Sin cambios."
          else
            git add data.json
            git commit -m "Resultados $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
